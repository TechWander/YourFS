name: Release

# Build multi-architecture pure-Rust binaries and publish them as a GitHub
# Release. Triggered by pushing a version tag (e.g. v2.0.0). ARM *static*
# (musl) targets are built here via `cross` because they need a musl C
# cross-toolchain that is not available on typical x86_64 build hosts.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archtag: linux-x86_64-gnu
            use_cross: false
          - target: x86_64-unknown-linux-musl
            archtag: linux-x86_64-musl
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            archtag: linux-aarch64-gnu
            use_cross: true
          - target: aarch64-unknown-linux-musl
            archtag: linux-aarch64-musl
            use_cross: true
          - target: armv7-unknown-linux-gnueabihf
            archtag: linux-armv7-gnueabihf
            use_cross: true
          - target: armv7-unknown-linux-musleabihf
            archtag: linux-armv7-musleabihf
            use_cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .cargo-cache
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install musl tools (native x86_64 musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          mkdir -p dist stage
          cp "target/${{ matrix.target }}/release/yourfs" \
             "target/${{ matrix.target }}/release/yourfs-tool" stage/
          pkg="dist/yourfs-${VERSION}-${{ matrix.archtag }}.tar.gz"
          tar -C stage -czf "$pkg" yourfs yourfs-tool
          echo "PACKAGED=$pkg" >>"$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archtag }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "linux-*"

      - name: Assemble release assets + checksums
        run: |
          set -euo pipefail
          mkdir -p out
          find artifacts -name '*.tar.gz' -exec cp {} out/ \;
          ( cd out && sha256sum yourfs-*.tar.gz >SHA256SUMS.txt )
          ls -1 out

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.tar.gz
            out/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## YourFS ${{ github.ref_name }} (pure-Rust)

            Fully pure-Rust build: FUSE via `fuser`, NFS via `nfs-rs`. No
            `libfuse` / `libnfs` are linked, so the binaries are self-contained
            (musl builds are fully static).

            ### Assets
            | file | architecture | libc |
            |------|--------------|------|
            | `*-linux-x86_64-gnu` | AMD64 | glibc |
            | `*-linux-x86_64-musl` | AMD64 | static musl |
            | `*-linux-aarch64-gnu` | ARM64 | glibc |
            | `*-linux-aarch64-musl` | ARM64 | static musl |
            | `*-linux-armv7-gnueabihf` | ARM32 hf | glibc |
            | `*-linux-armv7-musleabihf` | ARM32 hf | static musl |

            Verify with `sha256sum -c SHA256SUMS.txt`.
