[package]
name = "yourfs"
version = "2.0.0"
edition = "2021"
description = "A read-only file system with file isolation capabilities over NFS (Rust rewrite of yourfs)"
license = "GPL-2.0-or-later"

[lib]
name = "yourfs"
path = "src/lib.rs"

[[bin]]
name = "yourfs"
path = "src/bin/yourfs.rs"

[[bin]]
name = "yourfs-tool"
path = "src/bin/yourfs_tool.rs"

[dependencies]
libc = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
postgres = "0.19"
redis = "0.25"
# Pure-Rust FUSE and NFS clients, replacing the hand-written libfuse/libnfs
# FFI bindings (and the vendored libfuse.a / libnfs.a static archives).
# fuser's `libfuse*` features stay OFF so no C libfuse is linked; mounting is
# done through the fusermount helper (already a hard runtime requirement).
fuser = "0.18"
nfs-rs = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync"] }
bytes = "1"
